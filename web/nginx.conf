server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Öğün fotoğrafı en fazla 5 MB; biraz pay bırakıyoruz.
    client_max_body_size 6m;

    # /api ile başlayan istekleri API konteynerine ilet (aynı adres → CORS gerekmez).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React tek sayfa uygulaması: bilinmeyen adresler index.html'e düşer,
    # sayfa yönlendirmesini React yapar (ör. /danisanlar/123 yenilenince 404 olmasın).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
